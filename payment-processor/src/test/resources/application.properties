# Override main application.properties for tests
# Disable the Kafka consumer route during tests - we test direct routes with mocks
camel.route.payment-processor.auto-startup=false
quarkus.http.test-port=0

# Fast retries for tests (reduce total test time)
provider.max-retries=1
provider.retry-backoff=100ms
provider.circuit-breaker.wait-duration=1s

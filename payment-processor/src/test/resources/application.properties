# Override main application.properties for tests
# Enable Kafka consumer route for integration tests (KafkaTestResource provides the broker)
camel.route.payment-processor.auto-startup=true
quarkus.http.test-port=0

# Fast retries for tests (reduce total test time)
provider.max-retries=1
provider.retry-backoff=100ms
provider.circuit-breaker.wait-duration=1s
provider.circuit-breaker.sliding-window-size=10

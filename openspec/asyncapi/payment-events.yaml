asyncapi: 3.0.0
info:
  title: Payment Events
  version: 1.0.0
  description: AsyncAPI specification for Payment Orchestration Layer events

defaultContentType: application/json

servers:
  kafka:
    host: localhost:9092
    protocol: kafka
    description: Kafka broker for development

channels:
  payment.received:
    address: payments.events.received
    description: Event published when a new payment is received by the API Gateway
    messages:
      $ref: '#/components/messages/PaymentReceived'
    publish:
      summary: Payment received
      description: Published by API Gateway when a new payment request enters the system

  payment.processed:
    address: payments.events.processed
    description: Event published when a payment has been successfully processed by a provider
    messages:
      $ref: '#/components/messages/PaymentProcessed'
    publish:
      summary: Payment processed
      description: Published by ProviderSelectionRoute after successful provider response

  payment.failed:
    address: payments.events.failed
    description: Event published when payment is rejected by fraud engine
    messages:
      $ref: '#/components/messages/PaymentFailed'
    publish:
      summary: Payment failed
      description: Published by FraudEngineRoute when fraud action is REJECT

  payment.review:
    address: payments.events.review
    description: Event published when payment requires manual fraud review
    messages:
      $ref: '#/components/messages/PaymentReview'
    publish:
      summary: Payment review
      description: Published by FraudEngineRoute when fraud action is REVIEW

  fraud.detected:
    address: fraud.events.detected
    description: Event published when fraud evaluation completes
    messages:
      $ref: '#/components/messages/FraudDetected'
    publish:
      summary: Fraud evaluation result
      description: Published by FraudEngineRoute with the FraudResult (APPROVE/REVIEW/REJECT)

  payment.status.changed:
    address: payments.events.status.changed
    description: Event published when payment status changes
    messages:
      $ref: '#/components/messages/PaymentStatusChanged'
    publish:
      summary: Payment status changed
      description: Published by API Gateway when payment status transitions

  payment.audit:
    address: payments.events.audit
    description: Event published for payment audit trail via wire tap
    messages:
      $ref: '#/components/messages/PaymentAudit'
    publish:
      summary: Payment audit event
      description: Published by AuditPipelineRoute via wire tap from main processor

  payment.retry:
    address: payments.events.retry
    description: Retry queue for transient payment processing failures
    messages:
      $ref: '#/components/messages/PaymentRetry'
    publish:
      summary: Payment retry
      description: Published by PaymentProcessorRoute when main route retries are exhausted

  payment.dead-letter:
    address: payments.events.dead-letter
    description: Event published when payment processing exhausts all retries or encounters poison messages
    messages:
      $ref: '#/components/messages/PaymentDeadLetter'
    publish:
      summary: Payment dead letter event
      description: Published by dead letter handlers when payment cannot be processed

components:
  messages:
    PaymentReceived:
      name: PaymentReceived
      title: Payment Received Event
      summary: Event triggered when a new payment request is received
      payload:
        $ref: '#/components/schemas/PaymentReceivedPayload'

    PaymentProcessed:
      name: PaymentProcessed
      title: Payment Processed Event
      summary: Event triggered when a payment has been successfully processed by a provider
      payload:
        $ref: '#/components/schemas/PaymentProcessedPayload'

    PaymentFailed:
      name: PaymentFailed
      title: Payment Failed Event
      summary: Event triggered when payment is rejected by fraud engine
      payload:
        $ref: '#/components/schemas/PaymentMessagePayload'

    PaymentReview:
      name: PaymentReview
      title: Payment Review Event
      summary: Event triggered when payment requires manual review
      payload:
        $ref: '#/components/schemas/PaymentMessagePayload'

    FraudDetected:
      name: FraudDetected
      title: Fraud Evaluation Result
      summary: Event triggered when fraud detection evaluates a payment
      payload:
        $ref: '#/components/schemas/FraudDetectedPayload'

    PaymentStatusChanged:
      name: PaymentStatusChanged
      title: Payment Status Changed
      summary: Event triggered when payment status changes
      payload:
        $ref: '#/components/schemas/PaymentStatusChangedPayload'

    PaymentAudit:
      name: PaymentAudit
      title: Payment Audit Event
      summary: Event triggered for payment audit trail (wire tap)
      payload:
        $ref: '#/components/schemas/PaymentMessagePayload'

    PaymentRetry:
      name: PaymentRetry
      title: Payment Retry Event
      summary: Event triggered when payment retries are exhausted on main processor
      payload:
        $ref: '#/components/schemas/PaymentMessagePayload'

    PaymentDeadLetter:
      name: PaymentDeadLetter
      title: Payment Dead Letter Event
      summary: Event triggered when payment cannot be processed after all attempts
      payload:
        $ref: '#/components/schemas/PaymentDeadLetterPayload'

  schemas:
    PaymentReceivedPayload:
      type: object
      required:
        - paymentId
        - amount
        - currency
        - customerId
        - paymentMethod
      properties:
        paymentId:
          type: string
          description: Unique payment identifier
        amount:
          type: string
          description: Payment amount (serialized as string by API Gateway)
        currency:
          type: string
          enum: [USD, EUR, GBP, MXN, JPY]
        customerId:
          type: string
        paymentMethod:
          type: string
        country:
          type: string
          nullable: true
        metadata:
          $ref: '#/components/schemas/PaymentMetadata'

    PaymentProcessedPayload:
      type: object
      required:
        - providerId
        - transactionId
        - success
        - processedAt
      properties:
        providerId:
          type: string
          description: Provider that processed the payment
        transactionId:
          type: string
          description: Provider transaction identifier
        success:
          type: boolean
          description: Whether the provider call succeeded
        errorCode:
          type: string
          nullable: true
          description: Error code if provider call failed
        errorMessage:
          type: string
          nullable: true
          description: Error message if provider call failed
        processedAt:
          type: string
          format: date-time
          description: Timestamp when provider processed the payment

    PaymentMessagePayload:
      type: object
      description: Full payment message used internally across Camel routes
      properties:
        eventId:
          type: string
          nullable: true
        paymentId:
          type: string
        amount:
          type: number
        currency:
          type: string
        customerId:
          type: string
        paymentMethod:
          type: string
        country:
          type: string
          nullable: true
        attemptCount:
          type: integer
        isNewPaymentMethod:
          type: boolean
        customerAgeDays:
          type: integer
        timeZone:
          type: string
          nullable: true
        metadata:
          $ref: '#/components/schemas/PaymentMetadata'
        timestamp:
          type: string
          format: date-time
          nullable: true

    FraudDetectedPayload:
      type: object
      required:
        - type
        - paymentId
        - amount
        - customerId
        - riskScore
        - triggeredRules
        - action
      properties:
        type:
          type: string
          enum: [APPROVE, REVIEW, REJECT]
          description: Jackson polymorphism discriminator
        paymentId:
          type: string
        amount:
          type: number
        customerId:
          type: string
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        triggeredRules:
          type: array
          items:
            type: string
          example: ["HIGH_AMOUNT", "HIGH_RISK_COUNTRY"]
        action:
          type: string
          enum: [APPROVE, REVIEW, REJECT]
        reason:
          type: string
          nullable: true
          description: Present only for REVIEW and REJECT actions

    PaymentStatusChangedPayload:
      type: object
      required:
        - paymentId
        - status
      properties:
        paymentId:
          type: string
        status:
          type: string
          enum: [PENDING, PROCESSING, APPROVED, REJECTED, FAILED, REVIEW]

    PaymentDeadLetterPayload:
      type: object
      description: Dead letter payload (may come from API Gateway or payment-processor)
      properties:
        paymentId:
          type: string
        originalPayload:
          type: string
          nullable: true
          description: Original serialized payment message (from API Gateway)
        reason:
          type: string
          nullable: true
          description: Failure reason (from API Gateway)
        amount:
          type: number
          nullable: true
          description: Present when published by payment-processor as PaymentMessage
        currency:
          type: string
          nullable: true
        customerId:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
        metadata:
          $ref: '#/components/schemas/PaymentMetadata'

    PaymentMetadata:
      type: object
      properties:
        order_id:
          type: string
        attempts:
          type: integer
        is_new_payment_method:
          type: boolean
        payment_method_age_days:
          type: integer
        customer_risk_tier:
          type: string
        enriched_at:
          type: string
        velocity_score:
          type: integer
        geo_risk_score:
          type: integer

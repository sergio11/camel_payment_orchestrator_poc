apiVersion: v1
kind: Pod
metadata:
  name: monitoring-stack
  labels:
    app: monitoring
spec:
  containers:
  - name: prometheus
    image: prom/prometheus:v2.47.0
    ports:
    - containerPort: 9090
    volumeMounts:
    - name: prometheus-config
      mountPath: /etc/prometheus/prometheus.yml
      subPath: prometheus-config.yaml
  - name: grafana
    image: grafana/grafana:10.1.0
    ports:
    - containerPort: 3000
    env:
    - name: GF_SECURITY_ADMIN_USER
      value: "admin"
    - name: GF_SECURITY_ADMIN_PASSWORD
      value: "admin"
  volumes:
  - name: prometheus-config
    hostPath:
      path: c:\Users\ssanchez\Documents\poc_camel\monitoring\prometheus-config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: monitoring
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: monitoring
  ports:
  - name: http
    port: 3000
    targetPort: 3000

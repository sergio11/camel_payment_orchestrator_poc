apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: poc-camel
spec:
  template:
    spec:
      containers:
        - name: payment-processor
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE
              value: "false"
            - name: CORS_ORIGINS
              value: "https://localhost:3000"

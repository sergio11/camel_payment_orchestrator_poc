apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: poc-camel

resources:
  - ../../base

# Override replicas for dev environment
replicas:
  - name: api-gateway
    count: 1
  - name: payment-processor
    count: 2

# Dev-specific patches
patches:
  - path: patches/api-gateway-dev-patch.yaml
    target:
      kind: Deployment
      name: api-gateway
  - path: patches/payment-processor-dev-patch.yaml
    target:
      kind: Deployment
      name: payment-processor

# Dev-specific images (use local images loaded into Kind)
images:
  - name: poc-camel/api-gateway
    newName: localhost/poc-camel/api-gateway
    newTag: dev
  - name: poc-camel/payment-processor
    newName: localhost/poc-camel/payment-processor
    newTag: dev

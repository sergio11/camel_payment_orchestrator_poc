apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: poc-camel

resources:
  - api-gateway-deployment.yaml
  - payment-processor-deployment.yaml
  - service-account.yaml
  - services.yaml
  - configmaps.yaml
  - secrets.yaml
  - jaeger-configmap.yaml
  - hpa.yaml
  - networkpolicy.yaml
  # postgres StatefulSet+PVC+Service live in kubernetes/infrastructure/postgres.yaml
  # and are deployed via k8s:infra (glob *.yaml), not here, to keep infra/app split.

labels:
  - pairs:
      managed-by: kustomize

commonAnnotations:
  managed-by: kustomize
  version: "1.0.0"

# Images (will be overridden by overlays)
images:
  - name: poc-camel/api-gateway
    newTag: latest
  - name: poc-camel/payment-processor
    newTag: latest

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-scraper
  namespace: poc-camel
  labels:
    app: prometheus
    managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-scraper-binding
  namespace: poc-camel
  labels:
    app: prometheus
    managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-scraper
subjects:
  - kind: ServiceAccount
    name: default
    namespace: poc-camel

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 8778
    targetPort: 8778
---
apiVersion: v1
kind: Service
metadata:
  name: payment-processor
spec:
  type: ClusterIP
  selector:
    app: payment-processor
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 8778
    targetPort: 8778
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
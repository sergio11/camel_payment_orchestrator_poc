# HTTP Server
quarkus.http.port=8080

# OpenAPI / Swagger (prod off by default, dev/test on)
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
%test.quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Health Check
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready
quarkus.smallrye-health.startup-path=/health/started

# Application
quarkus.application.name=payment-gateway

# CORS (hardened: configurable via CORS_ORIGINS, no wildcard in prod)
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:https://localhost:3000}

# Datasource (prod default: PostgreSQL via env; dev/test override to H2 below)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD:payments123}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./target/payments-dev;AUTO_SERVER=TRUE;MODE=PostgreSQL
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.flyway.migrate-at-start=false

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:payments_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.topic.payments.received=payments.events.received

# Camel Kafka
camel.component.kafka.brokers=${kafka.bootstrap.servers}

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p traceId=%X{traceId} %s%e%n

# Kafka Consumer for Status Updates
kafka.topic.payments.processed=payments.events.processed
kafka.topic.payments.failed=payments.events.failed
kafka.topic.payments.review=payments.events.review
kafka.topic.payments.status.changed=payments.events.status.changed
kafka.topic.payments.retry=payments.events.retry
kafka.topic.payments.dead-letter=payments.events.dead-letter
kafka.topic.dead.letter=payments.events.dead-letter
kafka.topic.payments.review=payments.events.review

# Kafka consumer reliability: manual commit, offsets committed only after successful DB update
kafka.enable.auto.commit=false
camel.component.kafka.enable-auto-commit=false

# Observability (micrometer already in pom; explicit path to match K8s prometheus.io/path: /q/metrics)
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# OpenTelemetry / Distributed Tracing
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.exporter.otlp.endpoint=http://localhost:4317
quarkus.opentelemetry.service.name=payment-gateway
quarkus.opentelemetry.traces.exporter=otlp
quarkus.opentelemetry.metrics.exporter=none

# JSON Logging
quarkus.log.console.json=true